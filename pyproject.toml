[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warraq"
version = "1.0.0"
description = "Warraq — a local, GPU-accelerated Arabic OCR & translation studio for books and manuscripts."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Warraq contributors" }]
keywords = ["arabic", "ocr", "manuscripts", "footnotes", "translation", "glm-ocr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Natural Language :: Arabic",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
# PyTorch is intentionally NOT listed here: the installers pick the right
# build (CUDA on Windows/NVIDIA, Metal/MPS on Apple Silicon, or CPU).
dependencies = [
  "transformers>=5.6,<6",
  "accelerate>=1.1",
  "huggingface_hub>=1.0",
  "safetensors>=0.4",
  "tokenizers>=0.22",
  "pillow>=10.3",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pypdfium2>=4.30",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-bidi>=0.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "platformdirs>=4.2",
  "psutil>=5.9",
  "httpx>=0.27",
  "pywebview>=5.3; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
quant = ["bitsandbytes>=0.43; sys_platform != 'darwin'"]
nllb = ["sentencepiece>=0.2"]
dev = ["pytest>=8", "fonttools>=4.50"]

[project.scripts]
warraq = "warraq.cli:main"

[project.gui-scripts]
warraq-gui = "warraq.app:main"

[tool.setuptools.packages.find]
include = ["warraq*"]

[tool.setuptools.package-data]
warraq = ["web/**/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
